[project]
name = "ninecat"
version = "0.1.0"
description = "NineCat fantasy basketball analytics backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "psycopg[binary]>=3.2",
    "itsdangerous>=2.2",
    "cryptography>=43",
    "apscheduler>=3.10",
    "nba_api>=1.4",
    "yahoo_fantasy_api>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ninecat"]

[tool.pytest.ini_options]
pythonpath = ["src"]
