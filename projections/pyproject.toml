[project]
name = "nineproj"
version = "0.1.0"
description = "2026-27 NBA 9-cat fantasy projection pipeline"
requires-python = ">=3.12"
dependencies = [
    "nba_api>=1.4",
    "pydantic>=2",
    "httpx",
    "ninecat",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nineproj"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.sources]
# reuse the tested ninecat.engine pure modules instead of copying them (plan D1)
ninecat = { path = "../backend", editable = true }
